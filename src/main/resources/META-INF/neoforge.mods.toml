modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/team-abnormals/berry-good/issues"
license = "https://github.com/team-abnormals/berry-good/blob/main/LICENSE.txt"

[[mixins]]
    config = "berry_good.mixins.json"

[[mods]]
    modId = "berry_good"
    version = "${mod_version}"
    logoFile = "logo.png"
    itemIcon = "berry_good:sweet_berry_pips"
    configBackground = "minecraft:textures/block/spruce_log.png"
    authors = "Team Abnormals"
    credits = "SmellyModder, Cameron, five, bageldotjpg"
    displayURL = "https://www.teamabnormals.com/mods/berry-good"
    displayName = "Berry Good"
    description = '''
    Makes sweet berries less annoying to eat and adds more berry related content
    '''

[[dependencies.berry_good]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${mc_version}]"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.berry_good]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.berry_good]]
    modId = "blueprint"
    type = "required"
    versionRange = "[${blueprint},)"
    ordering = "AFTER"
    side = "BOTH"